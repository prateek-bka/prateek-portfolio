name: Deploy

on:
  push:
    branches: [main]
  # Run by hand with an older commit to roll back; a commit whose image is
  # still on the server (last 3) goes live in seconds.
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit to deploy (blank = latest main)"
        required: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Lint and typecheck
        run: |
          npm ci
          npx next typegen
          npx eslint src
          npx tsc --noEmit
      - name: Deploy
        run: |
          install -m 600 /dev/null key && echo "${{ secrets.DEPLOY_SSH_KEY }}" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "${{ inputs.ref || github.sha }}"
          rm -f key
