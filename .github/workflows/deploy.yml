name: Deploy

# Every push to main rebuilds prateekagrawal.com on tara (ARM64 Oracle VM).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Lint and typecheck
        run: |
          npm ci
          npx next typegen
          npx eslint src
          npx tsc --noEmit
      - name: Build and restart on tara
        run: |
          install -m 600 /dev/null key && echo "${{ secrets.DEPLOY_SSH_KEY }}" > key
          ssh -i key -o StrictHostKeyChecking=accept-new ubuntu@${{ secrets.TARA_VM_IP }} "${{ github.sha }}"
